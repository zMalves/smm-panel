<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMM Panel Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0f17; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #131b26; border: 1px solid #1e293b; }
    .input-dark { background-color: #0b0f17; border: 1px solid #1e293b; color: #f1f5f9; }
    .input-dark:focus { border-color: #3b82f6; outline: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="card p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl border border-gray-800">
    <div class="text-center space-y-2">
      <div class="inline-flex bg-blue-600/20 text-blue-400 p-3 rounded-2xl border border-blue-500/30">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">SMM Panel Pro</h1>
      <p class="text-xs text-gray-400">Acesse com suas credenciais de operador ou administrador</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div id="loginError" class="hidden p-3 bg-red-950/60 border border-red-800 text-red-400 rounded-xl text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span id="loginErrorMsg">Usuário ou senha inválidos</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Usuário</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-gray-500 absolute left-3 top-3"></i>
          <input type="text" id="username" placeholder="Seu usuário" required class="w-full input-dark rounded-xl pl-10 pr-4 py-2.5 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Senha</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-gray-500 absolute left-3 top-3"></i>
          <input type="password" id="password" placeholder="••••••••" required class="w-full input-dark rounded-xl pl-10 pr-4 py-2.5 text-sm">
        </div>
      </div>

      <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel
      </button>
    </form>

    <div class="border-t border-gray-800/80 pt-4 text-center">
      <p class="text-[11px] text-gray-500">
        Protegido por Autenticação JWT & Tokens MCP Criptografados
      </p>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "Verificando...";

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          if (data.token) {
            localStorage.setItem('jwt_token', data.token);
          }
          window.location.href = '/';
        } else {
          errBox.classList.remove('hidden');
          document.getElementById('loginErrorMsg').innerText = data.error || 'Falha ao autenticar';
        }
      } catch (err) {
        errBox.classList.remove('hidden');
        document.getElementById('loginErrorMsg').innerText = 'Erro de conexão: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
