<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMM Panel Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 10%, #f0f4ff 0%, #f8fafc 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.02);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-card p-8 sm:p-10 rounded-3xl w-full max-w-md space-y-7 text-slate-800">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-2xl shadow-lg shadow-blue-500/30 mb-1">
        <i data-lucide="layers" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">SMM Panel Pro</h1>
      <p class="text-xs text-slate-500">Entre na sua conta para gerenciar serviços e automações</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div id="loginError" class="hidden p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="loginErrorMsg">Usuário ou senha incorretos</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          <input type="text" id="username" placeholder="Digite seu usuário" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Senha</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition outline-none">
        </div>
      </div>

      <button type="submit" id="btnLogin"
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 text-sm mt-3">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel
      </button>
    </form>

    <div class="border-t border-slate-100 pt-4 text-center">
      <span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-slate-400">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i> Protegido com Criptografia JWT & SQLite
      </span>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Validando...`;

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          if (data.token) {
            localStorage.setItem('jwt_token', data.token);
          }
          window.location.href = '/';
        } else {
          errBox.classList.remove('hidden');
          document.getElementById('loginErrorMsg').innerText = data.error || 'Credenciais inválidas';
        }
      } catch (err) {
        errBox.classList.remove('hidden');
        document.getElementById('loginErrorMsg').innerText = 'Erro ao conectar: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
